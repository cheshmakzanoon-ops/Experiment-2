name: Verify editor reliability repairs

on:
  push:
    branches: [main]
    paths:
      - .github/finish-repairs.py
      - .github/workflows/hardening-verify.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: editor-repair-verification
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: editor-repair-candidate
          run-id: 35202962410
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recovered
      - name: Restore exact reviewed source
        env:
          PATCH: ${{ runner.temp }}/recovered/candidate.patch
        run: |
          echo "2272b39120265b363b75a8e9f4b8bf218373f8bf978f684573b79e7ff3325a86  $PATCH" | sha256sum -c -
          git apply --check "$PATCH"
          git apply "$PATCH"
          python .github/finish-repairs.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Format then verify
        run: |
          ./gradlew ktlintFormat --stacktrace
          ./gradlew ktlintCheck detekt --stacktrace
      - name: Archive exact candidate
        if: always()
        run: |
          git add app
          git archive --format=tar.gz "$(git write-tree)" > "${RUNNER_TEMP}/candidate-source.tar.gz"
          git diff --cached --binary HEAD -- app > "${RUNNER_TEMP}/candidate.patch"
          cd "${RUNNER_TEMP}"
          sha256sum candidate.patch > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-repair-candidate
          path: |
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate-source.tar.gz
            ${{ runner.temp }}/SHA256SUMS
            app/build/reports/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: editor-repair-candidate
          path: ${{ runner.temp }}/candidate
      - name: Apply exact candidate
        run: |
          cd "${RUNNER_TEMP}/candidate/_temp"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          git apply --check "${RUNNER_TEMP}/candidate/_temp/candidate.patch"
          git apply "${RUNNER_TEMP}/candidate/_temp/candidate.patch"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, analysis, APK and release bundle
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest ktlintCheck detekt lintDebug lintRelease assembleDebug bundleRelease --continue --stacktrace 2>&1 | tee "${RUNNER_TEMP}/build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-repair-build-results
          path: |
            app/build/reports/
            ${{ runner.temp }}/build.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: editor-repair-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

  device-tests:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: editor-repair-candidate
          path: ${{ runner.temp }}/candidate
      - name: Apply exact candidate
        run: |
          (cd "${RUNNER_TEMP}/candidate/_temp" && sha256sum -c SHA256SUMS)
          git apply --check "${RUNNER_TEMP}/candidate/_temp/candidate.patch"
          git apply "${RUNNER_TEMP}/candidate/_temp/candidate.patch"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-repair-device-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  publish-verified-repairs:
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: editor-repair-candidate
          path: ${{ runner.temp }}/candidate
      - name: Publish verified app sources and remove temporary repair payloads
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_HEAD"
          (cd "${RUNNER_TEMP}/candidate/_temp" && sha256sum -c SHA256SUMS)
          git apply --check "${RUNNER_TEMP}/candidate/_temp/candidate.patch"
          git apply "${RUNNER_TEMP}/candidate/_temp/candidate.patch"
          git rm -r .github/hardening-parts
          git rm .github/hardening-followup.patch.xz .github/finish-repairs.py .github/workflows/hardening-verify.yml .github/workflows/source-review.yml
          git add app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve artwork and repair painting, fills, layer compositing and renderer lifecycle' -m "Verified in run $GITHUB_RUN_ID: JVM tests, ktlint, detekt, debug/release lint, debug APK, release AAB and API 26/36 instrumentation."
          git push origin HEAD:main
