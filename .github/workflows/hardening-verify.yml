name: Verify editor reliability repairs

on:
  push:
    branches: [main]
    paths:
      - .github/hardening-parts/**
      - .github/workflows/hardening-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-repair-verification
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply hash-verified source edits
        shell: python
        run: |
          import hashlib, json, lzma, pathlib
          root = pathlib.Path.cwd().resolve()
          packed = b''.join((root / f'.github/hardening-parts/{i}.xzpart').read_bytes() for i in range(4))
          assert hashlib.sha256(packed).hexdigest() == 'd2d4141a5e6ed671b6d05e7523b8a2ff7f838312db2d797e123480d7bf80f895'
          entries = json.loads(lzma.decompress(packed))
          assert len({e['path'] for e in entries}) == len(entries)
          for entry in entries:
              path = root / entry['path']
              assert entry['path'].startswith('app/') and path.resolve().is_relative_to(root / 'app')
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == entry['old'], f"Source changed: {path}"
              lines = old.decode('utf-8').splitlines(keepends=True)
              limit = len(lines)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= limit
                  lines[start:end] = replacement.splitlines(keepends=True)
                  limit = start
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == entry['new'], f"Edit mismatch: {path}"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          print(f'Applied {len(entries)} source files; all before/after hashes verified.')
          path = root / 'app/src/main/java/com/artflow/studio/presentation/ui/components/canvas/ArtFlowCanvasView.kt'
          text = path.read_text()
          old = '                    if (!canvasRepository.commitRasterEdit(session, description)) onStatusMessage?.invoke("The layer changed; this gesture was discarded")'
          new = '                    if (!canvasRepository.commitRasterEdit(session, description)) {\n                        onStatusMessage?.invoke("The layer changed; this gesture was discarded")\n                    }'
          assert text.count(old) == 1, 'Expected the exact overlong statement'
          path.write_text(text.replace(old, new))
      - name: Format candidate with existing repository rules
        run: |
          ./gradlew ktlintFormat --stacktrace
          ./gradlew ktlintCheck --stacktrace
      - name: Archive exact candidate
        if: always()
        run: |
          git add app
          git archive --format=tar.gz "$(git write-tree)" > "${RUNNER_TEMP}/candidate-source.tar.gz"
          git diff --cached --binary HEAD -- app > "${RUNNER_TEMP}/candidate.patch"
          cd "${RUNNER_TEMP}"
          sha256sum candidate.patch > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-repair-candidate
          path: |
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate-source.tar.gz
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: editor-repair-candidate
          path: ${{ runner.temp }}/candidate
      - name: Apply exact formatted candidate
        run: |
          (cd "${RUNNER_TEMP}/candidate" && sha256sum -c SHA256SUMS)
          git apply --check "${RUNNER_TEMP}/candidate/candidate.patch"
          git apply "${RUNNER_TEMP}/candidate/candidate.patch"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, analysis, APK and minified bundle
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest ktlintCheck detekt lintDebug lintRelease assembleDebug bundleRelease --continue --stacktrace 2>&1 | tee "${RUNNER_TEMP}/build.log"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-repair-build-results
          path: |
            app/build/reports/
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload candidate builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: editor-repair-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

  device-tests:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: editor-repair-candidate
          path: ${{ runner.temp }}/candidate
      - name: Apply exact formatted candidate
        run: |
          (cd "${RUNNER_TEMP}/candidate" && sha256sum -c SHA256SUMS)
          git apply --check "${RUNNER_TEMP}/candidate/candidate.patch"
          git apply "${RUNNER_TEMP}/candidate/candidate.patch"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise editor and storage on device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Capture device diagnostics
        if: always()
        run: |
          adb logcat -d > "${RUNNER_TEMP}/device-logcat.txt" || true
          adb pull /sdcard/Android/data/com.artflow.studio/files/test-evidence "${RUNNER_TEMP}/test-evidence" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-repair-device-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/device-logcat.txt
            ${{ runner.temp }}/test-evidence/
          if-no-files-found: ignore
          retention-days: 14

  publish-verified-repairs:
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: editor-repair-candidate
          path: ${{ runner.temp }}/candidate
      - name: Commit only the candidate that passed every gate
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_HEAD"
          (cd "${RUNNER_TEMP}/candidate" && sha256sum -c SHA256SUMS)
          git apply --check "${RUNNER_TEMP}/candidate/candidate.patch"
          git apply "${RUNNER_TEMP}/candidate/candidate.patch"
          git rm -r .github/hardening-parts
          git rm .github/workflows/hardening-verify.yml .github/workflows/source-review.yml
          git add app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve artwork across saves, cancelled edits and GL lifecycle changes' -m "Verified by workflow run $GITHUB_RUN_ID: JVM tests, ktlint, detekt, Android lint, debug APK, release AAB, and API 26/36 instrumentation."
          git push origin HEAD:main
