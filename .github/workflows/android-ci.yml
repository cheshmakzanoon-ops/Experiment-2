name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, static analysis and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Archive exact source revision
        run: |
          git archive --format=tar.gz HEAD > "${RUNNER_TEMP}/artflow-source.tar.gz"
          git rev-parse HEAD > "${RUNNER_TEMP}/REVISION.txt"

      - name: Upload source provenance
        uses: actions/upload-artifact@v4
        with:
          name: artflow-source
          path: |
            ${{ runner.temp }}/artflow-source.tar.gz
            ${{ runner.temp }}/REVISION.txt
          if-no-files-found: error
          retention-days: 14

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test the artifact verifier
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Verify production builds reject missing signing inputs
        run: |
          if ./gradlew help -PrequireReleaseSigning=true > "${RUNNER_TEMP}/signing-negative.log" 2>&1; then
            echo "Production signing guard unexpectedly accepted an unsigned checkout"
            exit 1
          fi
          grep -F "Production signing is required" "${RUNNER_TEMP}/signing-negative.log"

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Static analysis
        run: ./gradlew ktlintCheck detekt lintDebug lintRelease --continue --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Check packaged artifact integrity and native alignment
        run: |
          set -o pipefail
          python .github/scripts/verify_android_artifacts.py app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab | tee "${RUNNER_TEMP}/artifact-preflight.txt"

      - name: Preserve generated Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/artifact-preflight.txt
            ${{ runner.temp }}/signing-negative.log
          if-no-files-found: ignore
          retention-days: 14

      # A failed preflight must not destroy the binary needed to diagnose that failure.
      # These are explicitly unverified outputs, never a signed production release.
      - name: Preserve diagnostic APK and bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artflow-builds-unverified
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 14

  device-tests:
    name: Device tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            label: API 26
            artifact: '26'
            target: google_apis
            page_size: 4096
          - api: 35
            label: API 35
            artifact: '35'
            target: google_apis_ps16k
            page_size: 16384
          - api: 36
            label: API 36
            artifact: '36'
            target: google_apis
            page_size: 4096
          - api: 35
            label: API 35 independent 16 KB repeat
            artifact: 35-16k-repeat
            target: google_apis_ps16k
            page_size: 16384
          - api: 36
            label: API 36 16 KB
            artifact: 36-16k
            target: google_apis_ps16k
            page_size: 16384
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests
        env:
          EXPECTED_PAGE_SIZE: ${{ matrix.page_size }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/scripts/run-device-tests.sh
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-results-api-${{ matrix.artifact }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/artflow-device/
          if-no-files-found: ignore
          retention-days: 14
