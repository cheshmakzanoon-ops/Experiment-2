name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, static analysis and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes `tools`, which no longer
          # exists in the SDK repository (sdkmanager: "Failed to find package
          # 'tools'"); platform-tools is all the Gradle build needs.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The JVM unit tests cover the pure-Kotlin engines, so no NDK is involved.
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Enforced here as well as locally, so style/analysis drift cannot land on main.
      - name: Static analysis (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt --stacktrace

      # -PnoNativeBuild skips the CMake module (libartflow-brush), which would need the NDK.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug -PnoNativeBuild --stacktrace

      # R8 minification, resource shrinking and lintVital only run in the release variant, so this is
      # where release-only breakage surfaces. Signing is skipped when keystore.properties is absent
      # (it is git-ignored), which still exercises the full shrink/package path.
      - name: Assemble release bundle
        run: ./gradlew bundleRelease -PnoNativeBuild --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK and bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: artflow-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
