name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, static analysis and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Archive exact source revision
        run: |
          git archive --format=tar.gz HEAD > "${RUNNER_TEMP}/artflow-source.tar.gz"
          git rev-parse HEAD > "${RUNNER_TEMP}/REVISION.txt"

      - name: Upload source provenance
        uses: actions/upload-artifact@v4
        with:
          name: artflow-source
          path: |
            ${{ runner.temp }}/artflow-source.tar.gz
            ${{ runner.temp }}/REVISION.txt
          if-no-files-found: error
          retention-days: 14

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test artifact verification and reference parsers
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python -m unittest discover -s tools -p 'test_*.py'

      - name: Verify production builds reject missing signing inputs
        run: |
          if ./gradlew help -PrequireReleaseSigning=true > "${RUNNER_TEMP}/signing-negative.log" 2>&1; then
            echo "Production signing guard unexpectedly accepted an unsigned checkout"
            exit 1
          fi
          grep -F "Production signing is required" "${RUNNER_TEMP}/signing-negative.log"

      # Documents saved by Procreate itself, from Avarel/silicate, fetched rather than committed. The job
      # fails if they are still missing after three attempts, so RealProcreateFilesTest cannot skip in CI.
      - name: Fetch Procreate sample documents
        run: |
          set -euo pipefail
          git lfs install --skip-repo
          dest="${RUNNER_TEMP}/silicate"
          for attempt in 1 2 3; do
            echo "Procreate sample fetch attempt ${attempt}/3"
            rm -rf "$dest"
            if GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/Avarel/silicate "$dest" \
              && git -C "$dest" lfs pull --include "demo_files/*" \
              && ls "$dest"/demo_files/*.procreate >/dev/null 2>&1; then
              break
            fi
            if (( attempt == 3 )); then
              echo "No Procreate sample documents after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          ls -l "$dest/demo_files"
          echo "PROCREATE_SAMPLES=$dest/demo_files" >> "$GITHUB_ENV"

      # This existing user-selected corpus is an input only: it stays outside the checkout,
      # source archives, Gradle caches and uploaded artifacts.
      - name: Fetch and verify the reference brush corpus
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir gdown==5.2.0
          export ARTFLOW_REFERENCE_IPA="${RUNNER_TEMP}/artflow-reference/reference.ipa"
          mkdir -p "$(dirname "$ARTFLOW_REFERENCE_IPA")"
          for attempt in 1 2 3; do
            echo "Reference corpus fetch attempt ${attempt}/3"
            rm -f "$ARTFLOW_REFERENCE_IPA"
            if timeout --kill-after=15s 300s python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import gdown

          target = Path(os.environ['ARTFLOW_REFERENCE_IPA'])
          if not gdown.download(id='1xPr6e53L76Cq8exGFWOSvq96wt-NlLVC', output=str(target), quiet=True):
              raise RuntimeError('Reference corpus download failed')
          if not target.is_file() or target.stat().st_size != 777430382:
              raise RuntimeError('Unexpected reference corpus size')
          with target.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if digest != '7b1dad3ac95f8aeca3c22b432b5d6fd94182a3bf9f84fb93588adb126368b54e':
              raise RuntimeError('Reference corpus identity changed')
          print(f'Reference corpus verified: {target.stat().st_size} bytes, sha256={digest}')
          PY
            then
              echo "ARTFLOW_REFERENCE_IPA=$ARTFLOW_REFERENCE_IPA" >> "$GITHUB_ENV"
              break
            fi
            rm -f "$ARTFLOW_REFERENCE_IPA"
            if (( attempt == 3 )); then
              echo "No verified reference corpus after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee "${RUNNER_TEMP}/unit-tests.log"

      - name: Report on the Procreate sample documents
        if: always()
        run: cat app/build/procreate-samples.txt || echo "No Procreate sample report"

      - name: Static analysis
        run: |
          set -o pipefail
          ./gradlew ktlintCheck detekt lintDebug lintRelease --continue --stacktrace 2>&1 | tee "${RUNNER_TEMP}/static-analysis.log"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Check packaged artifact integrity and native alignment
        run: |
          set -o pipefail
          python .github/scripts/verify_android_artifacts.py app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab | tee "${RUNNER_TEMP}/artifact-preflight.txt"

      - name: Preserve generated Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            ${{ runner.temp }}/artifact-preflight.txt
            ${{ runner.temp }}/signing-negative.log
          if-no-files-found: ignore
          retention-days: 14

      # A failed preflight must not destroy the binary needed to diagnose that failure.
      # These are explicitly unverified outputs, never a signed production release.
      - name: Preserve diagnostic APK and bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artflow-builds-unverified
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise build, test and analysis failures
        if: failure()
        run: |
          grep -hE '^e: |FAILED$|^[A-Za-z]+Test > .* FAILED|AssertionError|Exception:' "${RUNNER_TEMP}"/unit-tests.log "${RUNNER_TEMP}"/static-analysis.log 2>/dev/null | grep -v '^\s*at ' | head -60 || true
          grep -hE '\.kt:[0-9]+:[0-9]+' "${RUNNER_TEMP}"/static-analysis.log 2>/dev/null | head -60 || true
          find app/build/reports/ktlint -name '*.txt' -size +0 -exec cat {} + 2>/dev/null || true
          find app/build/reports/detekt -name '*.md' -exec grep -E '^#|^\* |\.kt:[0-9]+' {} + 2>/dev/null | head -60 || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/reports/lint-results-*.xml"):
              for issue in ET.parse(path).getroot().iter("issue"):
                  if issue.get("severity") in ("Error", "Fatal"):
                      loc = issue.find("location")
                      where = f"{loc.get('file')}:{loc.get('line')}" if loc is not None else "?"
                      print(f"LINT {issue.get('id')}: {where}: {issue.get('message')}")
          PY

  device-tests:
    name: Device tests (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: 26
            label: API 26
            artifact: '26'
            target: google_apis
            page_size: 4096
          - api: 35
            label: API 35
            artifact: '35'
            target: google_apis_ps16k
            page_size: 16384
          - api: 36
            label: API 36
            artifact: '36'
            target: google_apis
            page_size: 4096
          - api: 35
            label: API 35 independent 16 KB repeat
            artifact: 35-16k-repeat
            target: google_apis_ps16k
            page_size: 16384
          - api: 36
            label: API 36 16 KB
            artifact: 36-16k
            target: google_apis_ps16k
            page_size: 16384
          - api: 36
            label: API 36 tablet
            artifact: 36-tablet
            target: google_apis
            page_size: 4096
            profile: pixel_c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare instrumentation artifacts
        shell: bash
        run: |
          set -uo pipefail
          status=1
          for attempt in 1 2 3; do
            echo "Instrumentation build attempt ${attempt}/3"
            ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace && exit 0
            status=$?
            if (( attempt < 3 )); then sleep $((attempt * 5)); fi
          done
          exit "$status"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests
        env:
          EXPECTED_PAGE_SIZE: ${{ matrix.page_size }}
          ART_JIT_MODE: ${{ matrix.api == 35 && 'disabled' || 'default' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/scripts/run-device-tests.sh
      - name: Verify complete device coverage and publish evidence summary
        if: always()
        env:
          EXPECTED_API: ${{ matrix.api }}
          EXPECTED_PAGE_SIZE: ${{ matrix.page_size }}
        run: |
          status=0
          python .github/scripts/summarize_device_results.py \
            --source app/src/androidTest/java \
            --results app/build/outputs/androidTest-results/connected/debug \
            --evidence app/build/outputs/connected_android_test_additional_output \
            --launch "${RUNNER_TEMP}/artflow-device/minified-launch.txt" \
            --api "$EXPECTED_API" --page-size "$EXPECTED_PAGE_SIZE" \
            --revision "$(git rev-parse HEAD)" \
            --output "${RUNNER_TEMP}/artflow-device" || status=$?
          cat "${RUNNER_TEMP}/artflow-device/verification.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-results-api-${{ matrix.artifact }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            ${{ runner.temp }}/artflow-device/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report live stroke timing
        if: always()
        run: find app/build/outputs/connected_android_test_additional_output "${RUNNER_TEMP}/artflow-device" -name 'stroke-timing.txt' -exec cat {} + 2>/dev/null || true

      - name: Summarise failed device tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          emitted = 0

          def note(message):
              # GitHub renders ::error:: lines as check annotations, which stay readable for a public
              # repository even when the job log needs a sign-in. Keep them single-line and escaped.
              global emitted
              if emitted >= 10:
                  return
              emitted += 1
              clean = " ".join(str(message).split()).replace("%", "%25")[:380]
              print(f"::error::{clean}")

          for path in glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      # Some failures carry only a stack trace, so keep both parts and drop blanks.
                      raw = "\n".join(filter(None, [(problem.get("message") or "").strip(), (problem.text or "").strip()]))
                      text = [line for line in raw.splitlines() if line.strip()]
                      name = f"{case.get('classname')}.{case.get('name')}"
                      print(f"FAILED {name}: {' | '.join(text[:6])[:900]}")
                      note(f"FAILED {name}: {' | '.join(text[:4])[:300]}")
                      # The frames that say who did it: the app's own, the test's and any cause.
                      trace = (problem.text or "").splitlines()
                      for line in [l.strip() for l in trace if "com.artflow" in l or "Caused by" in l][:30]:
                          print(f"    {line[:300]}")
          if emitted == 0:
              root = os.path.join(os.environ.get("RUNNER_TEMP", ""), "artflow-device")
              for path in glob.glob(os.path.join(root, "**", "*logcat*.txt"), recursive=True):
                  try:
                      for line in open(path, errors="ignore"):
                          if "FATAL EXCEPTION" in line or "Fatal signal" in line or "Process: com.artflow" in line:
                              note(line)
                  except OSError:
                      pass
          PY
          grep -rhE 'FAILED|Process crashed|INSTRUMENTATION_FAILED' "${RUNNER_TEMP}/artflow-device" 2>/dev/null | head -20 || true
          # The app's own crash, if any: the exception and the frames that explain it.
          grep -h -A 40 'FATAL EXCEPTION' "${RUNNER_TEMP}"/artflow-device/*logcat*.txt 2>/dev/null | grep -E 'FATAL|Process: |Exception|Error|Caused by|\tat com\.artflow|at com\.artflow' | head -60 || true
          # A native crash (including the first attempt before a framework-crash retry): the signal,
          # the crashing thread and the top of its backtrace.
          find "${RUNNER_TEMP}/artflow-device" -name '*logcat*.txt' -exec grep -hE 'Fatal signal|>>> com\.artflow|Abort message|#(0[0-9]|1[0-5]) pc ' {} + 2>/dev/null | head -80 || true
