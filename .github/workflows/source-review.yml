name: Source review snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/source-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git archive --format=tar.gz HEAD > "${RUNNER_TEMP}/source.tar.gz"
          git rev-parse HEAD > "${RUNNER_TEMP}/SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: source-review
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/SOURCE_COMMIT
          retention-days: 3
          if-no-files-found: error
