name: REA IPA static inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-ipa-static-inventory.yml'
      - 'tools/ipa_inventory.py'
      - 'tools/test_ipa_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rea-ipa-inventory
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove native/IPA inventory parser behavior on synthetic fixtures
        run: python -m unittest discover -s tools -p 'test_ipa_inventory.py' -v

      - name: Fetch and hash-verify the user-selected reference IPA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown==5.2.0
          python - <<'PY'
          import os
          from pathlib import Path
          import gdown
          out = Path(os.environ['RUNNER_TEMP']) / 'reference.ipa'
          if not gdown.download(id='1xPr6e53L76Cq8exGFWOSvq96wt-NlLVC',
                                output=str(out), quiet=True):
              raise RuntimeError('Reference IPA download failed')
          if out.stat().st_size != 777430382:
              raise RuntimeError('Unexpected reference IPA size')
          PY

      - name: Produce bounded package metadata and Mach-O evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ipa-evidence
          python tools/ipa_inventory.py \
            "$RUNNER_TEMP/reference.ipa" \
            --out ipa-evidence/inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('ipa-evidence/inventory.json').read_text())
          lines = [
              '# Hash-verified IPA / Mach-O static inventory', '',
              'This is read-only package analysis, not source decompilation or 1:1 behavior recovery.',
              'The user-supplied binary and licensed resources are never committed.', '',
              f"- Source SHA-256: `{evidence['sha256']}`",
              f"- Source bytes: {evidence['source_bytes']:,}",
              f"- ZIP members: {evidence['zip_members']:,}",
              f"- Expanded bytes declared: {evidence['declared_expanded_bytes']:,}",
              f"- Application roots: {', '.join(evidence['app_roots']) or 'none found'}",
              f"- Embedded framework names: {len(evidence['frameworks'])}",
              f"- Bundle Info.plist records: {len(evidence['bundle_plists'])}",
              f"- Bundle-declared executable headers: {len(evidence['declared_executables'])}",
              '',
              '## Declared bundle executables (static observation)', '',
          ]
          for path, entry in evidence['declared_executables'].items():
              binary = entry['binary']
              lines.append(f"- `{path}`: {binary['status']}")
              if binary['status'] == 'fat-container':
                  for part in binary['slices']:
                      detail = part['header']
                      lines.append(
                          f"  - {part['declared_architecture']}: "
                          f"{detail['status']}, encrypted={detail.get('contains_encrypted_region', 'unknown')}"
                      )
              else:
                  lines.append(
                      f"  - architecture={binary.get('architecture', 'unknown')}; "
                      f"encrypted={binary.get('contains_encrypted_region', 'unknown')}"
                  )
          lines.extend(['', '## Evidence boundaries', ''])
          lines.extend('- ' + limit for limit in evidence['limitations'])
          lines.extend([
              '', 'See [the machine-readable inventory](REA_IPA_STATIC_INVENTORY.json).',
              'Encryption flags do not disclose source code, cryptographic keys, or plaintext instructions.',
              'This report is limited to the unencrypted metadata visible in the supplied package.',
          ])
          Path('ipa-evidence/inventory.md').write_text('\n'.join(lines) + '\n')
          PY

      - name: Attempt REA inspection; preserve unsupported result as limitation
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea" --ignore-scripts rea-agents@6.7.0
          set +e
          timeout 900 "$RUNNER_TEMP/rea/node_modules/.bin/rea" \
            inspect-artifact "$RUNNER_TEMP/reference.ipa" \
            --detail summary \
            --evidence_output "$RUNNER_TEMP/rea-internal.json" \
            --json > ipa-evidence/rea-output.json 2> ipa-evidence/rea-stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > ipa-evidence/rea-exit-code.txt
          python - <<'PY'
          from pathlib import Path
          for name in ('rea-output.json', 'rea-stderr.txt'):
              file = Path('ipa-evidence') / name
              if file.exists() and file.stat().st_size > 64 * 1024:
                  file.write_text('REA output exceeds the public summary budget; omitted.\n')
          PY

      - name: Commit the generated evidence only
        shell: bash
        run: |
          set -euo pipefail
          cp ipa-evidence/inventory.json docs/REA_IPA_STATIC_INVENTORY.json
          cp ipa-evidence/inventory.md docs/REA_IPA_STATIC_INVENTORY.md
          printf '\n## REA CLI status\n\nExit code: %s (nonzero means this IPA inspection mode did not complete successfully).\n' \
            "$(cat ipa-evidence/rea-exit-code.txt)" >> docs/REA_IPA_STATIC_INVENTORY.md
          git add docs/REA_IPA_STATIC_INVENTORY.json docs/REA_IPA_STATIC_INVENTORY.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs(re): record verified native IPA package inventory'
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-ipa-inspection-evidence
          path: ipa-evidence/
          retention-days: 7
          if-no-files-found: warn
