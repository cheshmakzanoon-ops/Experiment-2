name: Android 15 16 KB emulator-only control

# This experiment never installs ArtFlow. It is NOT an app acceptance lane.
on:
  push:
    branches:
      - diagnostics/android15-16kb-idle-control
    paths:
      - .github/workflows/android15-16kb-idle-control.yml
      - .github/scripts/diagnose-android15-emulator-only.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-control:
    name: Emulator-only Ubuntu 22.04 (${{ matrix.jit }})
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        jit: [disabled, default]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app-free Android 15/16 KB control
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ART_JIT_MODE: ${{ matrix.jit }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/scripts/diagnose-android15-emulator-only.sh
      - name: Retain emulator-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-only-android15-16kb-${{ matrix.jit }}
          path: ${{ runner.temp }}/artflow-android15-control/
          if-no-files-found: warn
          retention-days: 14
