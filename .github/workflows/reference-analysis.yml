name: Reference static analysis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-analysis.yml'
      - 'tools/rea_brush_dependency_audit.py'
      - 'tools/test_rea_brush_dependency_audit.py'
      - 'tools/rea_source_field_shape_audit.py'
      - 'tools/test_rea_source_field_shape_audit.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-static-analysis
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect compound settings without executing reference code
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea" --ignore-scripts rea-agents@6.7.0
          python -m pip install --disable-pip-version-check gdown==5.2.0
          python - <<'PY'
          import hashlib, io, json, math, os, pathlib, plistlib, subprocess, zipfile
          import gdown
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          out = root / 'reference-evidence'
          out.mkdir()
          subprocess.run(['git', 'archive', '--format=zip', '--output=' + str(out / 'experiment-source.zip'), 'HEAD'], check=True)
          (out / 'source-commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          target = root / 'reference.ipa'
          gdown.download(id='1xPr6e53L76Cq8exGFWOSvq96wt-NlLVC', output=str(target), quiet=True)
          with target.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if digest != '7b1dad3ac95f8aeca3c22b432b5d6fd94182a3bf9f84fb93588adb126368b54e':
              raise RuntimeError('Reference identity changed')
          def resolve(value, objects, seen=frozenset(), depth=0):
              if depth > 24:
                  return {'unresolved': 'depth'}
              if isinstance(value, plistlib.UID):
                  index = value.data
                  if index in seen or index >= len(objects):
                      return {'unresolved': 'cycle or invalid reference'}
                  return resolve(objects[index], objects, seen | {index}, depth + 1)
              if isinstance(value, dict):
                  return {str(k): resolve(v, objects, seen, depth + 1) for k, v in value.items() if k != '$class'}
              if isinstance(value, list):
                  return [resolve(v, objects, seen, depth + 1) for v in value[:1024]]
              if isinstance(value, bytes):
                  return {'bytes': len(value), 'sha256': hashlib.sha256(value).hexdigest()}
              if isinstance(value, float) and not math.isfinite(value):
                  return str(value)
              return value if isinstance(value, (str, bool, int, float, type(None))) else str(type(value))
          records, samples = [], []
          with zipfile.ZipFile(target) as outer:
              for entry in outer.infolist():
                  if not entry.filename.endswith('.brush') or entry.file_size > 32 * 1024**2:
                      continue
                  with zipfile.ZipFile(io.BytesIO(outer.read(entry))) as inner:
                      members = inner.infolist()
                      if len(members) > 1024:
                          raise RuntimeError('Too many inner members')
                      archives = [m for m in members if m.filename.endswith('.archive')]
                      record = {'path': entry.filename, 'members': [m.filename for m in members], 'archives': []}
                      for member in archives:
                          if member.file_size > 2 * 1024**2:
                              raise RuntimeError('Settings exceed budget')
                          raw = inner.read(member)
                          value = plistlib.loads(raw)
                          objects = value.get('$objects', [])
                          record['archives'].append({'path': member.filename, 'sha256': hashlib.sha256(raw).hexdigest(),
                              'top': resolve(value.get('$top', value), objects)})
                          if len(archives) != 1 and len(samples) < 3:
                              path = root / ('compound-' + str(len(samples)) + '.archive')
                              path.write_bytes(raw)
                              samples.append(path)
                      records.append(record)
          (out / 'compound-structures.json').write_text(json.dumps({'reference_sha256': digest, 'brushes': records}, indent=2))
          rea = str(root / 'rea/node_modules/.bin/rea')
          for i, path in enumerate(samples):
              with (out / ('rea-compound-' + str(i) + '.json')).open('w') as stdout:
                  result = subprocess.run([rea, 'inspect-keyed-archive', str(path), '--json'], stdout=stdout, timeout=180)
                  if result.returncode:
                      raise RuntimeError('REA compound inspection failed')
          print(json.dumps({'brushes': len(records), 'compound_brushes': sum(len(r['archives']) != 1 for r in records),
              'rea_compound_samples': len(samples), 'runtime_executed': False}))
          PY
      - name: Verify reference brush dependency mapping
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_rea_brush_dependency_audit.py' -v
          python tools/rea_brush_dependency_audit.py \
            "$RUNNER_TEMP/reference-evidence/compound-structures.json" \
            app/src/main/java/com/artflow/studio/core/export/ProcreateBrush.kt \
            --out "$RUNNER_TEMP/reference-evidence/brush-dependency-audit.json"
      - name: Verify 264-key source schema against the full REA brush corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_rea_source_field_shape_audit.py' -v
          python tools/rea_source_field_shape_audit.py \
            "$RUNNER_TEMP/reference-evidence/compound-structures.json" \
            --out "$RUNNER_TEMP/reference-evidence/brush-source-schema.json"
      - name: Verify REA reader coverage and external image path candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/scripts -p 'test_rea_brush_coverage.py' -v
          python -m unittest discover -s .github/scripts -p 'test_rea_ipa_resource_links.py' -v
          python .github/scripts/rea_brush_coverage.py \
            "$RUNNER_TEMP/reference-evidence/compound-structures.json" \
            app/src/main/java/com/artflow/studio/core/export/ProcreateBrush.kt \
            --out "$RUNNER_TEMP/reference-evidence/brush-reader-coverage.json"
          python .github/scripts/rea_ipa_resource_links.py \
            "$RUNNER_TEMP/reference-evidence/compound-structures.json" \
            "$RUNNER_TEMP/reference.ipa" \
            --out "$RUNNER_TEMP/reference-evidence/brush-resource-candidates.json"
      - name: Index Apple asset catalog labels without extracting artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tempfile, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          ipa = root / 'reference.ipa'
          out = root / 'reference-evidence' / 'asset-catalog-name-index.json'
          report = {'scope': 'macOS assetutil metadata only; no artwork extraction or executable loading',
                    'source_sha256': '7b1dad3ac95f8aeca3c22b432b5d6fd94182a3bf9f84fb93588adb126368b54e',
                    'catalogs': [], 'limitations': []}
          try:
              executable = subprocess.run(['xcrun', '--find', 'assetutil'],
                                          check=True, capture_output=True, text=True, timeout=15).stdout.strip()
          except (OSError, subprocess.CalledProcessError, subprocess.TimeoutExpired):
              executable = ''
              report['limitations'].append('macOS assetutil unavailable on runner')
          with zipfile.ZipFile(ipa) as archive:
              catalogs = [part for part in archive.infolist()
                          if not part.is_dir() and part.filename.endswith('.car')]
              for index, member in enumerate(catalogs):
                  item = {'path': member.filename, 'declared_bytes': member.file_size,
                          'status': 'not-inspected'}
                  report['catalogs'].append(item)
                  if not executable:
                      item['status'] = 'assetutil-unavailable'
                      continue
                  if member.file_size > 512 * 1024 * 1024:
                      item['status'] = 'bounded-size-limit'
                      continue
                  with tempfile.TemporaryDirectory(dir=root) as tmp:
                      filename = pathlib.Path(tmp) / ('catalog-' + str(index) + '.car')
                      with archive.open(member) as source, filename.open('wb') as destination:
                          remaining = 512 * 1024 * 1024
                          while remaining:
                              block = source.read(min(1024 * 1024, remaining))
                              if not block: break
                              destination.write(block)
                              remaining -= len(block)
                          if source.read(1):
                              raise RuntimeError('Declared catalog size was understated')
                      try:
                          run = subprocess.run([executable, '--info', str(filename)],
                                               check=False, capture_output=True, timeout=180)
                          if run.returncode or len(run.stdout) > 64 * 1024 * 1024:
                              item['status'] = 'assetutil-failed-or-output-too-large'
                              item['exit_code'] = run.returncode
                              continue
                          entries = json.loads(run.stdout)
                          if not isinstance(entries, list) or len(entries) > 200000:
                              item['status'] = 'unexpected-assetutil-output'
                              continue
                          names = sorted({row['Name'] for row in entries
                                          if isinstance(row, dict) and
                                          isinstance(row.get('Name'), str) and
                                          0 < len(row['Name']) <= 512})
                          item['status'] = 'name-inventory-complete' if len(names) <= 20000 else 'name-inventory-truncated'
                          item['rendition_records'] = len(entries)
                          item['distinct_names_total'] = len(names)
                          item['distinct_names'] = names[:20000]
                      except (subprocess.TimeoutExpired, ValueError, OSError):
                          item['status'] = 'assetutil-unavailable-or-unparseable'
          report['limitations'].append('Catalog names are metadata and do not identify which brush loads a given rendition.')
          report['limitations'].append('Native rendering code, decrypted instructions and texture bytes are not recovered.')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'catalogs': len(report['catalogs']),
                            'analyzed': sum(x['status'].startswith('name-inventory') for x in report['catalogs'])}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-compound-brush-evidence
          path: ${{ runner.temp }}/reference-evidence/
          retention-days: 3
          if-no-files-found: error
