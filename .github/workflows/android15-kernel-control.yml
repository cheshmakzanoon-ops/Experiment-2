name: Android 15 16 KB kernel repair control

# Validate a kernel-only repair before adopting it in the required Android CI.
# Every invocation retains API35 system/vendor/ramdisk and the full test inventory.
on:
  push:
    branches:
      - fix/android15-16kb-kernel
  workflow_dispatch:

concurrency:
  group: android15-kernel-control-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel-control:
    name: API35 16 KB updated kernel, independent trial ${{ matrix.trial }}
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Freeze unchanged application and test inputs
        shell: bash
        run: |
          set -euo pipefail
          baseline=a0456ea2d5ea2a98eea4337f42c4e12f0a550cb4
          git diff --exit-code "$baseline" HEAD -- app build.gradle.kts settings.gradle.kts gradle gradlew gradlew.bat gradle.properties
          evidence="${RUNNER_TEMP}/artflow-device"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/REVISION.txt"
          git rev-parse HEAD:app > "$evidence/application-tree.txt"
          git archive --format=tar.gz HEAD > "$evidence/source.tar.gz"
          lscpu > "$evidence/host-cpu.txt"
          python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Prepare pinned official kernel only
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/artflow-device/kernel-preparation"
          python .github/scripts/prepare_emulator_kernel.py --manifest config/ci/android15-16kb-kernel.json --output "$output"
          echo "ARTFLOW_KERNEL_PATH=$output/kernel-ranchu" >> "$GITHUB_ENV"
          echo "ARTFLOW_KERNEL_MANIFEST=$output/kernel-source.json" >> "$GITHUB_ENV"
      - name: Prepare instrumentation artifacts
        shell: bash
        run: |
          set -uo pipefail
          status=1
          for attempt in 1 2 3; do
            echo "Instrumentation build attempt ${attempt}/3"
            ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace && exit 0
            status=$?
            if (( attempt < 3 )); then sleep $((attempt * 5)); fi
          done
          exit "$status"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run full instrumentation and minified launch on API35
        env:
          EXPECTED_PAGE_SIZE: '16384'
          ART_JIT_MODE: disabled
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -no-snapshot -show-kernel -kernel ${{ env.ARTFLOW_KERNEL_PATH }}
          script: bash .github/scripts/run-device-tests.sh
      - name: Verify complete inventory and first-attempt acceptance
        if: always()
        shell: bash
        run: |
          status=0
          python .github/scripts/summarize_device_results.py \
            --source app/src/androidTest/java \
            --results app/build/outputs/androidTest-results/connected/debug \
            --evidence app/build/outputs/connected_android_test_additional_output \
            --launch "${RUNNER_TEMP}/artflow-device/minified-launch.txt" \
            --api 35 --page-size 16384 \
            --revision "$(git rev-parse HEAD)" \
            --output "${RUNNER_TEMP}/artflow-device" || status=$?
          if [[ -d "${RUNNER_TEMP}/artflow-device/android15-framework-retry" ]]; then
            echo 'Recovered instrumentation cannot qualify the kernel control as a first-attempt pass.'
            status=1
          fi
          cat "${RUNNER_TEMP}/artflow-device/verification.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Preserve complete original evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api35-kernel-control-${{ matrix.trial }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            ${{ runner.temp }}/artflow-device/
          if-no-files-found: warn
          retention-days: 14
