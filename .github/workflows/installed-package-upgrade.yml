name: Installed application upgrade

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: installed-package-upgrade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installed-v1-to-v2:
    name: Installed Room v1 artwork upgrade — API 36
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          persist-credentials: false

      - name: Check out the authentic Room v1 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ca9ce535c09d35ceca6aba9f686c60f58f93bc09
          path: baseline
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up evidence verification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify the upgrade evidence contracts
        run: |
          python -m unittest discover -s .github/scripts -p 'test_run_package_upgrade.py' -v
          python -m unittest discover -s .github/scripts -p 'test_package_upgrade_build.py' -v

      - name: Capture exact source and install the test-only old UI driver
        run: |
          python .github/scripts/package_upgrade_build.py prepare \
            --candidate "$PWD" --baseline "${GITHUB_WORKSPACE}/baseline" \
            --output "${RUNNER_TEMP}/artflow-installed-upgrade"
          java -version > "${RUNNER_TEMP}/artflow-installed-upgrade/java-version.txt" 2>&1
          ./gradlew --version > "${RUNNER_TEMP}/artflow-installed-upgrade/candidate-gradle-version.txt" 2>&1
          (cd ../baseline && ./gradlew --version) > "${RUNNER_TEMP}/artflow-installed-upgrade/baseline-gradle-version.txt" 2>&1

      # Both builds run in this fresh job and use its same disposable Android debug key.
      # The host independently checks the real certificates of all four APKs before installation.
      - name: Build candidate application and instrumentation
        timeout-minutes: 30
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace \
            2>&1 | tee "${RUNNER_TEMP}/artflow-installed-upgrade/candidate-build.log"

      - name: Build the unchanged historical application and UI seed instrumentation
        timeout-minutes: 30
        working-directory: baseline
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace \
            2>&1 | tee "${RUNNER_TEMP}/artflow-installed-upgrade/baseline-build.log"

      - name: Bind built APKs to the unchanged source and overlay
        run: |
          python .github/scripts/package_upgrade_build.py finish --output "${RUNNER_TEMP}/artflow-installed-upgrade"
          echo "${ANDROID_HOME}/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Seed the old UI and execute one installed upgrade
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -no-snapshot
          script: python candidate/.github/scripts/run_installed_upgrade_ci.py --build-record "${RUNNER_TEMP}/artflow-installed-upgrade/build-provenance.json" --serial emulator-5554

      - name: Require the complete increasing-version installed v1 campaign
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "artflow-installed-upgrade"
          value = json.loads((root / "campaign/campaign.json").read_text())
          assert value["phase"] == "passed-scoped-package-campaign", value
          assert value["qualified"] is True and value["installedV1MigrationQualified"] is True
          assert value["replacementScope"] == "increasing-version-test-update"
          assert value["publisherQualified"] is False and value["storeReleaseQualified"] is False
          assert "automatedOldAppSeed" in value and "manualOldAppSeed" not in value
          assert "firstFailure" not in value
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Installed Room v1 upgrade passed\n\n")
              summary.write(f"Old source: `{value['oldSource']}`. Candidate: `{value['candidateSource']}`.\n\n")
              summary.write("One old-app UI seed and one increasing-version installation, followed by recovery/edit/save and fresh-process reopen.\n\n")
              summary.write("Rebuilt pinned historical source; disposable debug signing. Publisher, original-distribution and physical-device qualification remain separate.\n")
          PY

      - name: Preserve sources, APKs and every first-attempt observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-v1-upgrade-api-36-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/artflow-installed-upgrade/
          if-no-files-found: error
          retention-days: 14
