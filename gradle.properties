# Project-wide Gradle settings.

# The compiler and KSP run inside Gradle. A combined debug/release/lint build loads enough
# compiler classes to exhaust a 384 MiB metaspace even when heap memory is available.
# Budget 2.5 GiB heap + 1 GiB metaspace, with only two workers; use at least 6 GiB RAM
# for the complete release build and additional memory when running an Android emulator.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
