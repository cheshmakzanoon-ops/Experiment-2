# Project-wide Gradle settings.
# Budget the compiler/analysis processes plus extra memory for Android emulators.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2

# Isolate processors from the old compiler-plugin serialization runtime. Room 2.8's
# schema serializer requires its own newer runtime when reading exported schemas.
ksp.useKSP2=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
