# Project-wide Gradle settings.

# Memory budget.
#
# A build normally runs more than one JVM: the Gradle daemon, the Kotlin compile daemon, and any
# worker processes the Android plugin spawns. Each sizes its heap generously by default, and on a
# many-core host Gradle also sizes its worker pool from the CPU count, so on a constrained machine
# the defaults add up past the limit and the kernel OOM-kills the daemon part-way through a build,
# leaving a half-written one behind.
#
# These values are sized for a 4 GiB container, which is a common CI and sandbox size:
#
#   * 2.5 GiB heap. Measured: at 3 GiB the container hits its 4 GiB ceiling during minification,
#     because a JVM's resident set is the heap *plus* metaspace, code cache, thread stacks and JIT
#     data. 2.5 GiB keeps compile, KSP and packaging comfortably inside the limit.
#   * The Kotlin compiler runs in-process, so there is no second several-hundred-megabyte JVM
#     competing for the same limit.
#   * `workers.max` is capped, because the default is derived from the CPU count, which is
#     meaningless for a memory-bound build.
#
# Note that R8 (`minifyRelease` / `assembleRelease` / `bundleRelease`) is the peak of a build and
# wants more headroom than a 4 GiB container has — expect to run release builds on a larger machine
# or in CI. Debug builds, unit tests, lint, ktlint and detekt all fit comfortably.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
